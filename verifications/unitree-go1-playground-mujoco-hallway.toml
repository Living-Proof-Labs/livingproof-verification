# Unitree Go1 with the MuJoCo Playground policy walks the hallway in MuJoCo (Go1 has no stock policy).
# Verification pins a released robot tag. The robot publishes its adapter and
# configurations. Lock this definition with `python3 tools/lock.py` and review the diff.
# ref is livingproof-unitree-go1 v1.0.0, commit fa5383a64e6d351a7b592e75796bf1f32c107197.
# The call is walk-hallway.yml at capability-verifier v1.18.1. verification-lock passes
# this lock, and its releases are what the run reads.
format = "livingproof-verification-definition/0.1.0"
id = "unitree-go1-playground-mujoco-hallway"
procedure = "walk-hallway"

[robot]
repository = "Living-Proof-Labs/livingproof-unitree-go1"
ref = "v1.0.0"
configurations = ["playground"]
