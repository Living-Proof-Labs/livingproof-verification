# SPDX-License-Identifier: Apache-2.0
# Unitree Go1 with the MuJoCo Playground policy walks the hallway in MuJoCo (Go1 has no stock policy).
# walk-hallway 0.1.0 on hallway-open 0.1.0 (livingproof-verification#100 step 5).
# ref is livingproof-unitree-go1 v2.3.5, commit fe48f8bda30aa0a65bd01b06107fc76874195f35; its uv.lock
# installs livingproof-sim-mujoco v3.6.2, which the lock records as the runner. The robot is thin,
# so this definition owns scenario, world, plan and specs (v2.3.0, which has walk-hallway
# parameters.json; v2.0.2 does not, and capability-verifier v2.0.0 refuses that pin).
# The call is walk-hallway.yml at capability-verifier v2.0.0. Lock it with
# `python3 tools/lock.py` and review the diff.
format = "livingproof-verification-definition/0.1.0"
id = "unitree-go1-playground-mujoco-hallway"
procedure = "walk-hallway"
scenario = "walk-hallway@0.1.0"

[robot]
repository = "Living-Proof-Labs/livingproof-unitree-go1"
ref = "v2.3.5"
configurations = ["playground"]

# The world livingproof-sim-mujoco v2.0.3 vendors: livingproof-worlds v1.1.0.
# The lock records the commit and the world.json sha256.
[world]
id = "hallway-open"
version = "0.1.0"
repository = "Living-Proof-Labs/livingproof-worlds"
tag = "v1.1.0"

[plan]
trials = { count = 3 }
command_speed = 0.5

[releases.specs]
repository = "Living-Proof-Labs/robot-capability-specs"
tag = "v2.3.0"
