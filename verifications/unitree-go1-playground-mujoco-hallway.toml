# Unitree Go1 with the MuJoCo Playground policy walks the hallway in MuJoCo (Go1 has no stock policy).
# The robot repository supplies the configuration, world, simulator runner, specs and trial
# plan through its own verification.lock.json; this file only selects what to verify.
# Lock it with `livingproof capability verify lock <this file>` and review the lock diff.
# ref is the merged trial-model commit on livingproof-unitree-go1.
format = "livingproof-verification-definition/0.1.0"
id = "unitree-go1-playground-mujoco-hallway"
procedure = "walk-hallway"

[robot]
repository = "Living-Proof-Labs/livingproof-unitree-go1"
ref = "742355fa312f2dc96c0d23a9625367d7ece6ff02"
configurations = ["playground"]
