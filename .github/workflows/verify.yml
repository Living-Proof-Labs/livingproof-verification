# SPDX-License-Identifier: Apache-2.0
# Thin call: the capability verifier's reusable workflow runs every step (walk-hallway.yml
# for the walk-hallway definitions, scenario.yml for the walk-corner ones). The robot
# repository, commit and configurations below must equal the matching lock. Every uses
# commit is the capability-verifier release named in that line's `# vX.Y.Z` comment, and
# it must equal the locked verifier. verification-lock is this repository's 0.2.0 lock.
# The pinned release reads that lock even when the robot commit still publishes its own.
# Release (push to main only): after the verification job passes for the same commit, the
# shared semantic-release workflow of collaboration-guidelines tags this repository's bundle
# (definitions, locks and publishing configuration). The site job waits for that outcome so a
# run records the bundle tag only when the tag resolves to the run's own commit. A rolling run
# still publishes when the release fails, is skipped, or publishes nothing. A published release
# re-runs report publication and the deploy together from the last successfully deployed snapshot.
name: verify
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset-history:
        description: Publish a new site without the earlier runs (only when history is lost)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Review guard: no verification runs (or publishes evidence) for pins that drift from the
  # reviewed locks: tests/test_locks.py (offline) and `lock --check --workflow`.
  locks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # uv itself, by sha256 (.github/requirements/uv.txt).
      - run: python3 -m pip install --user --require-hashes --no-deps -r .github/requirements/uv.txt
      # The full check: re-reads the robot at the locked commit (its lock for 0.1.0,
      # configuration sha256s, adapter and robot.json for 0.2.0) and parses this file.
      # Every package but the two git installs is hashed in .github/requirements/lock-check.txt
      # and installed with --require-hashes on its own: uv skipped the hash check on a URL wheel
      # when a git requirement shared the install. livingproof v1.4.9 and capability-verifier
      # are pinned by commit in lock-check-git.txt and installed after, with --no-deps
      # and --no-build-isolation: their build backends come hashed from build.txt.
      - name: A wrong hash must refuse the install
        run: |
          sed 's/--hash=sha256:8b7795748b54/--hash=sha256:0000000000ab/' \
            .github/requirements/lock-check.txt > "$RUNNER_TEMP/bad-hash.txt"
          if cmp -s .github/requirements/lock-check.txt "$RUNNER_TEMP/bad-hash.txt"; then
            echo "::error::the sed did not change a hash; update the pattern"; exit 1
          fi
          uv venv "$RUNNER_TEMP/bad-hash"
          if VIRTUAL_ENV="$RUNNER_TEMP/bad-hash" UV_CACHE_DIR="$RUNNER_TEMP/bad-hash-cache" \
            uv pip install --require-hashes --no-deps -r "$RUNNER_TEMP/bad-hash.txt"; then
            echo "::error::a wrong livingproof-common hash installed"; exit 1
          fi
      - name: Install the lock check tools
        run: |
          uv venv "$RUNNER_TEMP/lock-check"
          VIRTUAL_ENV="$RUNNER_TEMP/lock-check" uv pip install --require-hashes --no-deps \
            -r .github/requirements/lock-check.txt -r .github/requirements/build.txt
          VIRTUAL_ENV="$RUNNER_TEMP/lock-check" uv pip install --no-deps --no-build-isolation \
            -r .github/requirements/lock-check-git.txt
          uv venv "$RUNNER_TEMP/tests"
          VIRTUAL_ENV="$RUNNER_TEMP/tests" uv pip install --require-hashes --no-deps \
            -r .github/requirements/tests.txt
      - name: livingproof capability verify lock --check --workflow
        run: |
          for definition in verifications/*.toml; do
            # settings.toml names the reporter. It is not a verification definition.
            [ "$(basename "$definition")" = settings.toml ] && continue
            # The verifier's own message stays. This names the fix, because a failing
            # check stops the job before pytest.
            "$RUNNER_TEMP/lock-check/bin/livingproof" capability verify lock --check \
              --workflow .github/workflows/verify.yml "$definition" \
              || { echo "::error::run python3 tools/lock.py --update and commit the lock diff with a fix: or chore: prefix"; exit 1; }
          done
      - run: '"$RUNNER_TEMP/tests/bin/pytest" tests/test_locks.py'
  unitree-g1-stock-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: cdab1cfe50351bc8611cab5dbb6d1a1b23cc179f
      configurations: '["stock"]'
      verification-lock: verifications/unitree-g1-stock-mujoco-hallway.lock.json
      artifact-prefix: unitree-g1-stock-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-g1-playground-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: cdab1cfe50351bc8611cab5dbb6d1a1b23cc179f
      configurations: '["playground"]'
      verification-lock: verifications/unitree-g1-playground-mujoco-hallway.lock.json
      artifact-prefix: unitree-g1-playground-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  booster-t1-stock-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-booster-t1
      ref: 56f6051fd9ee9fdb17f609bf559b7efc8220088a
      configurations: '["stock"]'
      verification-lock: verifications/booster-t1-stock-mujoco-hallway.lock.json
      artifact-prefix: booster-t1-stock-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-go1-playground-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-go1
      ref: fe48f8bda30aa0a65bd01b06107fc76874195f35
      configurations: '["playground"]'
      verification-lock: verifications/unitree-go1-playground-mujoco-hallway.lock.json
      artifact-prefix: unitree-go1-playground-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  # walk-corner (robot-capability-specs#40): scenario.yml runs the scenario and world each
  # lock names. The walk-hallway jobs above keep walk-hallway.yml, the wrapper around it.
  unitree-g1-stock-mujoco-corner-left:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/scenario.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: 379a20e29caf136414ca3413e7244a73a0298290
      configurations: '["stock"]'
      verification-lock: verifications/unitree-g1-stock-mujoco-corner-left.lock.json
      artifact-prefix: unitree-g1-stock-mujoco-corner-left-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-g1-stock-mujoco-corner-right:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/scenario.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: 379a20e29caf136414ca3413e7244a73a0298290
      configurations: '["stock"]'
      verification-lock: verifications/unitree-g1-stock-mujoco-corner-right.lock.json
      artifact-prefix: unitree-g1-stock-mujoco-corner-right-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  booster-t1-stock-mujoco-corner-left:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/scenario.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-booster-t1
      ref: eefadce5bb8692bee7052912f4a807a33e022c0e
      configurations: '["stock"]'
      verification-lock: verifications/booster-t1-stock-mujoco-corner-left.lock.json
      artifact-prefix: booster-t1-stock-mujoco-corner-left-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  booster-t1-stock-mujoco-corner-right:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/scenario.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-booster-t1
      ref: eefadce5bb8692bee7052912f4a807a33e022c0e
      configurations: '["stock"]'
      verification-lock: verifications/booster-t1-stock-mujoco-corner-right.lock.json
      artifact-prefix: booster-t1-stock-mujoco-corner-right-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-go1-playground-mujoco-corner-left:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/scenario.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-go1
      ref: 5f4cdd048cedb6e51e830f2f703056da2fb86fdf
      configurations: '["playground"]'
      verification-lock: verifications/unitree-go1-playground-mujoco-corner-left.lock.json
      artifact-prefix: unitree-go1-playground-mujoco-corner-left-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-go1-playground-mujoco-corner-right:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/scenario.yml@0c00c388c693012392da0c1cd391046c752e9b3c  # v2.11.4
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-go1
      ref: 5f4cdd048cedb6e51e830f2f703056da2fb86fdf
      configurations: '["playground"]'
      verification-lock: verifications/unitree-go1-playground-mujoco-corner-right.lock.json
      artifact-prefix: unitree-go1-playground-mujoco-corner-right-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  # Stable queue gate: pipeline/integrity success, not the robot capability verdict.
  # After the trials, tools/world_guard.py fails this job (it does not warn) when a
  # world's geometry declares walls and a run recorded none, or the base starts at
  # the origin while the named start place does not. Same-run artifacts only.
  verification:
    needs:
      - locks
      - unitree-g1-stock-mujoco-hallway
      - unitree-g1-playground-mujoco-hallway
      - booster-t1-stock-mujoco-hallway
      - unitree-go1-playground-mujoco-hallway
      - unitree-g1-stock-mujoco-corner-left
      - unitree-g1-stock-mujoco-corner-right
      - booster-t1-stock-mujoco-corner-left
      - booster-t1-stock-mujoco-corner-right
      - unitree-go1-playground-mujoco-corner-left
      - unitree-go1-playground-mujoco-corner-right
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {
              "locks",
              "unitree-g1-stock-mujoco-hallway",
              "unitree-g1-playground-mujoco-hallway",
              "booster-t1-stock-mujoco-hallway",
              "unitree-go1-playground-mujoco-hallway",
              "unitree-g1-stock-mujoco-corner-left",
              "unitree-g1-stock-mujoco-corner-right",
              "booster-t1-stock-mujoco-corner-left",
              "booster-t1-stock-mujoco-corner-right",
              "unitree-go1-playground-mujoco-corner-left",
              "unitree-go1-playground-mujoco-corner-right",
          }
          if not isinstance(results, dict) or set(results) != expected:
              raise SystemExit("Missing or unexpected verification dependencies")
          if any(not isinstance(job, dict) or job.get("result") != "success"
                 for job in results.values()):
              raise SystemExit("Every verification dependency must succeed")
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-evidence-*'
          path: evidence
      - name: Refuse a silent world fallback
        run: python3 tools/world_guard.py evidence
      # Each run's manifest must record the scenario parameters digest its lock declares
      # (livingproof-sim-mujoco v3.5.0 and later; #145). A run that records none fails.
      - name: Refuse a parameters digest that differs from the lock
        run: python3 tools/parameters_digest.py --evidence evidence --locks verifications
  # Bundle release (push to main only). `needs: verification` is the whole gate: that job's
  # check fails unless every verification job succeeded, and with no status function in this
  # `if` GitHub's default success() skips the release when it failed, was skipped or the run was
  # cancelled. Pull requests, merge groups and manual runs never match. The shared workflow
  # tags HEAD only when new releasable commits exist and never moves a published tag, so a
  # re-run on an already tagged commit publishes nothing (published=false).
  # The tag is the reviewed collaboration-guidelines release; docs/bundle-releases.md has
  # the resolved commit, the gating cases and the rule for bumping it.
  release:
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.9.4
  # Publishing (push to main only): generate this run's report pages and, in the same
  # workflow, deploy that site. `pages` runs only after this job succeeds, so the site is
  # not deployed unless the reports are being generated. A rolling run does not read the
  # release outcome. A published release re-runs the report build below before deploy.
  # History is the last Pages artifact whose `pages` job succeeded, not a newer upload
  # from a failed deploy. Layout and index only (tools/site.py): the verifier graded and
  # the reporter rendered; nothing is committed.
  site:
    needs:
      - unitree-g1-stock-mujoco-hallway
      - unitree-g1-playground-mujoco-hallway
      - booster-t1-stock-mujoco-hallway
      - unitree-go1-playground-mujoco-hallway
      - unitree-g1-stock-mujoco-corner-left
      - unitree-g1-stock-mujoco-corner-right
      - booster-t1-stock-mujoco-corner-left
      - booster-t1-stock-mujoco-corner-right
      - unitree-go1-playground-mujoco-corner-left
      - unitree-go1-playground-mujoco-corner-right
      - release
    # `release` is a dependency only for ordering: it may be skipped, fail or publish nothing
    # and the evidence still publishes, so success() is replaced by !cancelled() plus the
    # explicit success of every verification job (what success() required before).
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.reset-history)) &&
      needs.unitree-g1-stock-mujoco-hallway.result == 'success' &&
      needs.unitree-g1-playground-mujoco-hallway.result == 'success' &&
      needs.booster-t1-stock-mujoco-hallway.result == 'success' &&
      needs.unitree-go1-playground-mujoco-hallway.result == 'success' &&
      needs.unitree-g1-stock-mujoco-corner-left.result == 'success' &&
      needs.unitree-g1-stock-mujoco-corner-right.result == 'success' &&
      needs.booster-t1-stock-mujoco-corner-left.result == 'success' &&
      needs.booster-t1-stock-mujoco-corner-right.result == 'success' &&
      needs.unitree-go1-playground-mujoco-corner-left.result == 'success' &&
      needs.unitree-go1-playground-mujoco-corner-right.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # One publish at a time, in order, so no run restores a site that misses its predecessor.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # list artifacts and the pages job that deployed them
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-tags: true  # the bundle tag tools/site.py resolves for this commit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-capability-report-*'
          path: reports
      # The evidence the reports link to, copied into the site (tools/site.py): Actions
      # artifacts expire and need a GitHub sign-in; the site copy does not.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-links-*'
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-mcap-*'
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-video-*'
          path: evidence
      - name: Restore earlier runs from the last successfully deployed snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://docs.livingprooflabs.com/livingproof-verification/
          RESET_HISTORY: ${{ inputs.reset-history && 'true' || 'false' }}
        run: |
          if [ "$RESET_HISTORY" = true ]; then
            python3 tools/site.py restore site --reset-history
          else
            python3 tools/site.py restore site
          fi
      - name: Install the pinned reporter
        run: |
          python3 tools/install_reporter.py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - name: Add this run and write the index pages
        id: publish-reports
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}  # read this run's artifact ids, expiry and digests
        run: |
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          python3 tools/site.py build site --reports reports --evidence evidence \
            --run-id "$RUN_ID" --commit "$COMMIT" --created "$created"
      - name: Build and verify the docs site
        run: |
          task docs:setup
          task docs:build
          python3 tools/docs/assemble.py --site site
          python3 tools/docs/verify.py --site site --require-reports
      # A published release re-runs report publication in this same job. `pages` then
      # deploys that result, so the release does not ship a site without regenerating
      # the reports. The re-run must keep every byte under reports/ and in site.json.
      - name: Re-run reports and the site together for a release
        if: needs.release.outputs.published == 'true'
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          CREATED: ${{ steps.publish-reports.outputs.created }}
          RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$RELEASE_TAG"
          test "$RELEASE_COMMIT" = "$GITHUB_SHA"
          test -n "$CREATED"
          python3 tools/site.py snapshot-publication site "$RUNNER_TEMP/publication.json"
          python3 tools/site.py build site --reports reports --evidence evidence \
            --run-id "$RUN_ID" --commit "$COMMIT" --created "$CREATED"
          python3 tools/site.py require-preserved site "$RUNNER_TEMP/publication.json"
          python3 tools/docs/verify.py --site site --require-reports
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          retention-days: 90  # the next run restores history from this artifact
  # Deploy only with the report publication above. A failed or skipped release does
  # not skip a site job that already succeeded (#189).
  pages:
    needs: site
    if: >-
      !cancelled() && needs.site.result == 'success' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.reset-history))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
