# SPDX-License-Identifier: Apache-2.0
# Unitree G1 with the MuJoCo Playground policy walks the hallway in MuJoCo.
# Verification pins a released robot tag. The robot publishes its adapter and
# configurations. Lock this definition with `python3 tools/lock.py` and review the diff.
# ref is livingproof-unitree-g1 v1.0.0, commit da7d9504cb5d4deaa509b92a1973490e43888f90,
# the same tag as unitree-g1-stock-mujoco-hallway.toml.
# The call is walk-hallway.yml at capability-verifier v1.18.5. verification-lock passes
# this lock, and its releases are what the run reads.
format = "livingproof-verification-definition/0.1.0"
id = "unitree-g1-playground-mujoco-hallway"
procedure = "walk-hallway"

[robot]
repository = "Living-Proof-Labs/livingproof-unitree-g1"
ref = "v1.0.0"
configurations = ["playground"]
