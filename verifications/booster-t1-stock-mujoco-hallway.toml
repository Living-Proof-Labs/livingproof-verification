# Booster T1 with its stock controller walks the hallway in MuJoCo.
# Verification pins a released robot tag. The robot publishes its adapter and
# configurations. Lock this definition with `python3 tools/lock.py` and review the diff.
# ref is livingproof-booster-t1 v1.0.0, commit 61b2559ebb401973ec7733b4c886753e6d2b704c.
# The call is walk-hallway.yml at capability-verifier v1.18.0. verification-lock passes
# this lock, and its releases are what the run reads.
format = "livingproof-verification-definition/0.1.0"
id = "booster-t1-stock-mujoco-hallway"
procedure = "walk-hallway"

[robot]
repository = "Living-Proof-Labs/livingproof-booster-t1"
ref = "v1.0.0"
configurations = ["stock"]
