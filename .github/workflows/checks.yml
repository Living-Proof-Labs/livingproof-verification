# SPDX-License-Identifier: Apache-2.0
# Lightweight pull request checks: lint, format, tests, workflow lint, a site build from
# fixture reports, the Renovate reporter extraction test, and the offline bundle-release
# engine re-run. Read-only: no deploy, no Pages permissions, only browser evidence artifacts uploaded (no site publication).
name: checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz (the release's checksums file).
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # uv, ruff, pytest and PyYAML by sha256 (.github/requirements/*.txt), as in the locks job.
      - run: python3 -m pip install --user --require-hashes --no-deps -r .github/requirements/uv.txt
      - name: Install the check tools
        run: |
          uv venv "$RUNNER_TEMP/checks"
          VIRTUAL_ENV="$RUNNER_TEMP/checks" uv pip install --require-hashes --no-deps \
            -r .github/requirements/checks.txt -r .github/requirements/tests.txt
          echo "$RUNNER_TEMP/checks/bin" >> "$GITHUB_PATH"
      - name: Install the pinned reporter
        run: python3 tools/install_reporter.py --venv "$RUNNER_TEMP/checks"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.54.0'
      - name: Build the site from fixture reports (not deployed)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/site_fixture.py write "$RUNNER_TEMP/reports"
          python3 tools/site.py build "$RUNNER_TEMP/site" --reports "$RUNNER_TEMP/reports" \
            --run-id "$RUN_ID" --commit "$COMMIT" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          task docs:setup
          task docs:build
          python3 tools/docs/assemble.py --site "$RUNNER_TEMP/site"
          python3 tools/docs/verify.py --site "$RUNNER_TEMP/site" --require-reports
          python3 tools/site_fixture.py check "$RUNNER_TEMP/site"
      - name: Install pinned browser tools and Chromium
        run: |
          VIRTUAL_ENV="$RUNNER_TEMP/checks" uv pip install --require-hashes --no-deps \
            -r .github/requirements/browser.txt
          python -m playwright install --with-deps chromium
      - name: Check card interactions and capture screenshots
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/site_browser.py "$RUNNER_TEMP/site" "$RUNNER_TEMP/browser-evidence"
      - name: Upload browser evidence (including failures)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: index-card-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/browser-evidence/
          if-no-files-found: error
          retention-days: 14
  # Shared semantic-release engine, same pin as verify.yml's release job. Git-only: the
  # GitHub plugin is not loaded, no token is passed, and git remotes are local. Node is
  # the same pinned tarball as the renovate job; the engine comes from the action's
  # package-lock.json at the recorded collaboration-guidelines commit.
  bundle-release-engine:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NODE_VERSION: 24.22.3
      # sha256 of node-v24.22.3-linux-x64.tar.xz (nodejs.org SHASUMS256.txt).
      NODE_SHA256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
      # Reviewed collaboration-guidelines tag (same as verify.yml) and its resolved commit.
      SHARED_RELEASE_TAG: v9.6.10
      SHARED_RELEASE_SHA: 54dcb297c628a4853c79bb31b5155e859afb7e93
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Living-Proof-Labs/collaboration-guidelines
          ref: 54dcb297c628a4853c79bb31b5155e859afb7e93
          persist-credentials: false
          path: collaboration-guidelines
      - name: Install Node.js
        run: |
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/v${NODE_VERSION}/$archive"
          echo "$NODE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install the pinned shared release engine
        run: |
          test "$(git -C collaboration-guidelines rev-parse HEAD)" = "$SHARED_RELEASE_SHA"
          npm ci --prefix collaboration-guidelines/.github/actions/semantic-release \
            --omit=dev --ignore-scripts
      - name: Re-run of an already tagged commit publishes nothing
        env:
          SHARED_RELEASE_ACTION: ${{ github.workspace }}/collaboration-guidelines/.github/actions/semantic-release
        run: node --test tests/bundle_release_rerun.test.mjs
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_VERSION: 24.22.3
      # sha256 of node-v24.22.3-linux-x64.tar.xz (nodejs.org SHASUMS256.txt).
      NODE_SHA256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node.js
        run: |
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/v${NODE_VERSION}/$archive"
          echo "$NODE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Validate Renovate and extract the reporter pin
        run: tools/renovate/run.sh
