# SPDX-License-Identifier: Apache-2.0
# Lightweight pull request checks: lint, format, tests, workflow lint and a site build from
# fixture reports. Read-only: no deploy, no Pages permissions, no artifacts published.
name: checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz (the release's checksums file).
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # uv, ruff, pytest and PyYAML by sha256 (.github/requirements/*.txt), as in the locks job.
      - run: python3 -m pip install --user --require-hashes --no-deps -r .github/requirements/uv.txt
      - name: Install the check tools
        run: |
          uv venv "$RUNNER_TEMP/checks"
          VIRTUAL_ENV="$RUNNER_TEMP/checks" uv pip install --require-hashes --no-deps \
            -r .github/requirements/checks.txt -r .github/requirements/tests.txt
          echo "$RUNNER_TEMP/checks/bin" >> "$GITHUB_PATH"
      - name: Install the pinned reporter
        run: python3 tools/install_reporter.py --venv "$RUNNER_TEMP/checks"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Build the site from fixture reports (not deployed)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/site_fixture.py write "$RUNNER_TEMP/reports"
          python3 tools/site.py build "$RUNNER_TEMP/site" --reports "$RUNNER_TEMP/reports" \
            --run-id "$RUN_ID" --commit "$COMMIT" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 tools/site_fixture.py check "$RUNNER_TEMP/site"
