# SPDX-License-Identifier: Apache-2.0
# Thin call: the capability verifier's reusable workflow runs every step. The values below
# must equal its verifications/<job id>.lock.json (the verifier commit it
# names, the robot repository, commit and configurations); the locks job (tests/test_locks.py) and
# `livingproof capability verify lock --check --workflow` fail when they drift.
name: verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Review guard: no verification runs (or publishes evidence) for pins that drift from the
  # reviewed locks: tests/test_locks.py (offline) and `lock --check --workflow`.
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --user uv==0.13.6
      # The full check: re-reads the robot lock at the locked commit and parses this file.
      # livingproof v1.4.9 and capability-verifier v1.10.0, pinned by commit.
      - name: livingproof capability verify lock --check --workflow
        run: |
          for definition in verifications/*.toml; do
            uvx --from "livingproof @ git+https://github.com/Living-Proof-Labs/livingproof@0398448326e414bfe38b95cf880b5e9d34bf7341" \
              --with "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl" \
              --with "capability-verifier @ git+https://github.com/Living-Proof-Labs/capability-verifier@043c221cff81444b8134caadcced6a9e12ae9552" \
              livingproof capability verify lock --check --workflow .github/workflows/verify.yml "$definition"
          done
      - run: uvx --from pytest==8.4.2 --with pyyaml==6.0.3 pytest tests/test_locks.py
  unitree-g1-stock-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@f8dc3d5634cf2ac2931e854b4f0b7d0ae39d7f0b
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: f3447e14ab7f70828d0cf769c7b6f7e512f89150
      configurations: '["stock"]'
      artifact-prefix: unitree-g1-stock-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-go1-playground-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@f8dc3d5634cf2ac2931e854b4f0b7d0ae39d7f0b
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-go1
      ref: f00751ab8b910903a1f816747af8ccbf37abfcf8
      configurations: '["playground"]'
      artifact-prefix: unitree-go1-playground-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  # Publishing (push to main only): lay this run's reports out into the Pages site, keeping
  # every earlier run from the previous Pages artifact. Layout and index only (tools/site.py):
  # the verifier graded and the reporter rendered; nothing is committed.
  site:
    needs: [unitree-g1-stock-mujoco-hallway, unitree-go1-playground-mujoco-hallway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One publish at a time, in order, so no run restores a site that misses its predecessor.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # list and download the previous Pages artifact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-capability-report-*'
          path: reports
      - name: Restore earlier runs from the previous Pages artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/site.py restore site
      - name: Add this run and write the index pages
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/site.py build site --reports reports --run-id "$RUN_ID" --commit "$COMMIT" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          retention-days: 90  # the next run restores history from this artifact
  pages:
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
