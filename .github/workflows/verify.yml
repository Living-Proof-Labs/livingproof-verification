# SPDX-License-Identifier: Apache-2.0
# Thin call: the capability verifier's reusable workflow runs every step. The robot
# repository, commit and configurations below must equal the matching lock. Every uses
# commit is the capability-verifier release named in that line's `# vX.Y.Z` comment, and
# it must equal the locked verifier. verification-lock is this repository's 0.2.0 lock.
# The pinned release reads that lock even when the robot commit still publishes its own.
name: verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset-history:
        description: Publish a new site without the earlier runs (only when history is lost)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Review guard: no verification runs (or publishes evidence) for pins that drift from the
  # reviewed locks: tests/test_locks.py (offline) and `lock --check --workflow`.
  locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # uv itself, by sha256 (.github/requirements/uv.txt).
      - run: python3 -m pip install --user --require-hashes --no-deps -r .github/requirements/uv.txt
      # The full check: re-reads the robot at the locked commit (its lock for 0.1.0,
      # configuration sha256s, adapter and robot.json for 0.2.0) and parses this file.
      # Every package but the two git installs is hashed in .github/requirements/lock-check.txt
      # and installed with --require-hashes on its own: uv skipped the hash check on a URL wheel
      # when a git requirement shared the install. livingproof v1.4.9 and capability-verifier
      # are pinned by commit in lock-check-git.txt and installed after, with --no-deps
      # and --no-build-isolation: their build backends come hashed from build.txt.
      - name: A wrong hash must refuse the install
        run: |
          sed 's/--hash=sha256:8b7795748b54/--hash=sha256:0000000000ab/' \
            .github/requirements/lock-check.txt > "$RUNNER_TEMP/bad-hash.txt"
          if cmp -s .github/requirements/lock-check.txt "$RUNNER_TEMP/bad-hash.txt"; then
            echo "::error::the sed did not change a hash; update the pattern"; exit 1
          fi
          uv venv "$RUNNER_TEMP/bad-hash"
          if VIRTUAL_ENV="$RUNNER_TEMP/bad-hash" UV_CACHE_DIR="$RUNNER_TEMP/bad-hash-cache" \
            uv pip install --require-hashes --no-deps -r "$RUNNER_TEMP/bad-hash.txt"; then
            echo "::error::a wrong livingproof-common hash installed"; exit 1
          fi
      - name: Install the lock check tools
        run: |
          uv venv "$RUNNER_TEMP/lock-check"
          VIRTUAL_ENV="$RUNNER_TEMP/lock-check" uv pip install --require-hashes --no-deps \
            -r .github/requirements/lock-check.txt -r .github/requirements/build.txt
          VIRTUAL_ENV="$RUNNER_TEMP/lock-check" uv pip install --no-deps --no-build-isolation \
            -r .github/requirements/lock-check-git.txt
          uv venv "$RUNNER_TEMP/tests"
          VIRTUAL_ENV="$RUNNER_TEMP/tests" uv pip install --require-hashes --no-deps \
            -r .github/requirements/tests.txt
      - name: livingproof capability verify lock --check --workflow
        run: |
          for definition in verifications/*.toml; do
            # settings.toml names the reporter. It is not a verification definition.
            [ "$(basename "$definition")" = settings.toml ] && continue
            "$RUNNER_TEMP/lock-check/bin/livingproof" capability verify lock --check \
              --workflow .github/workflows/verify.yml "$definition"
          done
      - run: '"$RUNNER_TEMP/tests/bin/pytest" tests/test_locks.py'
  unitree-g1-stock-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@8b303a672c003b82a90178364e7f107a58eaedac  # v1.18.3
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: da7d9504cb5d4deaa509b92a1973490e43888f90
      configurations: '["stock"]'
      verification-lock: verifications/unitree-g1-stock-mujoco-hallway.lock.json
      artifact-prefix: unitree-g1-stock-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-g1-playground-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@8b303a672c003b82a90178364e7f107a58eaedac  # v1.18.3
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-g1
      ref: da7d9504cb5d4deaa509b92a1973490e43888f90
      configurations: '["playground"]'
      verification-lock: verifications/unitree-g1-playground-mujoco-hallway.lock.json
      artifact-prefix: unitree-g1-playground-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  booster-t1-stock-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@8b303a672c003b82a90178364e7f107a58eaedac  # v1.18.3
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-booster-t1
      ref: 61b2559ebb401973ec7733b4c886753e6d2b704c
      configurations: '["stock"]'
      verification-lock: verifications/booster-t1-stock-mujoco-hallway.lock.json
      artifact-prefix: booster-t1-stock-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  unitree-go1-playground-mujoco-hallway:
    needs: locks
    uses: Living-Proof-Labs/capability-verifier/.github/workflows/walk-hallway.yml@8b303a672c003b82a90178364e7f107a58eaedac  # v1.18.3
    permissions:
      contents: read
      pull-requests: write
    with:
      repository: Living-Proof-Labs/livingproof-unitree-go1
      ref: fa5383a64e6d351a7b592e75796bf1f32c107197
      configurations: '["playground"]'
      verification-lock: verifications/unitree-go1-playground-mujoco-hallway.lock.json
      artifact-prefix: unitree-go1-playground-mujoco-hallway-
      check: false  # the robot repository's own CI tests the robot
      comment: false
  # Publishing (push to main only): lay this run's reports out into the Pages site, keeping
  # every earlier run from the previous Pages artifact. Layout and index only (tools/site.py):
  # the verifier graded and the reporter rendered; nothing is committed.
  site:
    needs: [unitree-g1-stock-mujoco-hallway, unitree-g1-playground-mujoco-hallway, booster-t1-stock-mujoco-hallway, unitree-go1-playground-mujoco-hallway]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.reset-history))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One publish at a time, in order, so no run restores a site that misses its predecessor.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read  # list and download the previous Pages artifact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-capability-report-*'
          path: reports
      # The evidence the reports link to, copied into the site (tools/site.py): Actions
      # artifacts expire and need a GitHub sign-in; the site copy does not.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-links-*'
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-mcap-*'
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-video-*'
          path: evidence
      - name: Restore earlier runs from the previous Pages artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://docs.livingprooflabs.com/livingproof-verification/
          RESET_HISTORY: ${{ inputs.reset-history && 'true' || 'false' }}
        run: |
          if [ "$RESET_HISTORY" = true ]; then
            python3 tools/site.py restore site --reset-history
          else
            python3 tools/site.py restore site
          fi
      - name: Add this run and write the index pages
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}  # read this run's artifact ids, expiry and digests
        run: |
          python3 tools/site.py build site --reports reports --evidence evidence \
            --run-id "$RUN_ID" --commit "$COMMIT" --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          retention-days: 90  # the next run restores history from this artifact
  pages:
    needs: site
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.reset-history))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
