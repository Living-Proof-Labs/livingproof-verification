# SPDX-License-Identifier: Apache-2.0
# Unitree G1 with the MuJoCo Playground policy walks the hallway in MuJoCo.
# The robot repository supplies the configuration, world, simulator runner, specs and trial
# plan through its own verification.lock.json; this file only selects what to verify.
# Lock it with `livingproof capability verify lock <this file>` and review the lock diff.
# ref is the merged sim-mujoco v2.0.3 commit on livingproof-unitree-g1, the same commit as
# unitree-g1-stock-mujoco-hallway.toml.
format = "livingproof-verification-definition/0.1.0"
id = "unitree-g1-playground-mujoco-hallway"
procedure = "walk-hallway"

[robot]
repository = "Living-Proof-Labs/livingproof-unitree-g1"
ref = "d72f18363e12cc84f68f6365803c9eccf0f13cf5"
configurations = ["playground"]
